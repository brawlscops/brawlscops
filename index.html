<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRAWLSCOPS — Smart Upgrade Advisor by FLAZEOX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   ROOT VARIABLES — thème lumineux/contrasté
══════════════════════════════════════ */
:root {
  --bg: #0a0e18;
  --bg2: #111827;
  --surface: #161d2e;
  --surface2: #1e2740;
  --surface3: #243050;
  --accent: #f7c948;
  --accent2: #ff7043;
  --accent3: #29d4ff;
  --accent4: #a78bfa;
  --tier-s: #ff4757;
  --tier-a: #ff7043;
  --tier-b: #f7c948;
  --tier-c: #4ade80;
  --tier-d: #94a3b8;
  --text: #f1f5f9;
  --text2: #cbd5e1;
  --text-muted: #64748b;
  --border: rgba(247,201,72,0.18);
  --border2: rgba(255,255,255,0.06);
  --card-shadow: 0 4px 24px rgba(0,0,0,0.5);
  --glow-gold: 0 0 24px rgba(247,201,72,0.35);
  --glow-blue: 0 0 20px rgba(41,212,255,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  font-family: 'Rajdhani', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── BACKGROUND AMBIANCE ── */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 40% at 50% 0%, rgba(247,201,72,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 5% 50%, rgba(41,212,255,0.04) 0%, transparent 55%),
    radial-gradient(ellipse 40% 60% at 95% 40%, rgba(255,112,67,0.04) 0%, transparent 55%);
}

body::after {
  content: '';
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px;
}

.container { max-width: 1200px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

/* ══════════════════════════════════════
   HEADER
══════════════════════════════════════ */
header {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  background: rgba(10,14,24,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  position: sticky; top: 0; z-index: 100;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
}

.logo-icon {
  width: 46px; height: 46px;
  border-radius: 11px;
  overflow: hidden;
  border: 2px solid rgba(247,201,72,0.4);
  box-shadow: var(--glow-gold);
  flex-shrink: 0;
}
.logo-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

.logo-texts {}
.logo-name {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 19px;
  letter-spacing: 2.5px;
  background: linear-gradient(90deg, #f7c948, #ff9a38);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  line-height: 1;
}
.logo-sub {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-family: 'Inter', sans-serif;
  margin-top: 2px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* lang-btn styles defined later in sheet */

.config-btn {
  padding: 5px 11px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--text-muted);
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.2s;
  line-height: 1;
}
.config-btn:hover { border-color: var(--accent3); color: var(--accent3); background: rgba(41,212,255,0.08); }
.config-btn.configured { border-color: #4ade80; color: #4ade80; background: rgba(74,222,128,0.08); }

/* ══════════════════════════════════════
   SEARCH HERO
══════════════════════════════════════ */
.search-zone {
  padding: 52px 0 32px;
  text-align: center;
}

.search-headline {
  font-family: 'Orbitron', monospace;
  font-size: clamp(26px, 5vw, 50px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 10px;
}
.search-headline span {
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.search-headline .line2 { color: var(--text2); }

.search-sub {
  font-size: 15px;
  color: var(--text-muted);
  font-family: 'Inter', sans-serif;
  font-weight: 400;
  margin-bottom: 32px;
  line-height: 1.5;
}

.search-bar {
  display: flex;
  gap: 10px;
  max-width: 500px;
  margin: 0 auto;
}

.tag-input {
  flex: 1;
  padding: 13px 18px;
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Orbitron', monospace;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  outline: none;
  transition: all 0.25s;
  text-transform: uppercase;
}
.tag-input::placeholder { color: var(--text-muted); font-weight: 400; letter-spacing: 1px; font-size: 12px; }
.tag-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(247,201,72,0.15);
  background: var(--surface3);
}

.search-btn {
  padding: 13px 24px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 12px;
  color: #000;
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.25s;
  white-space: nowrap;
}
.search-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(247,201,72,0.4); }
.search-btn:active { transform: translateY(0); }
.search-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* ── STATUS / LOADER ── */
.status-msg {
  text-align: center;
  padding: 12px 20px;
  border-radius: 10px;
  margin: 14px auto;
  max-width: 480px;
  font-weight: 600;
  font-size: 14px;
  display: none;
}
.status-msg.error { background: rgba(255,71,87,0.12); border: 1px solid rgba(255,71,87,0.35); color: #ff6b7a; }
.status-msg.info  { background: rgba(247,201,72,0.1); border: 1px solid rgba(247,201,72,0.35); color: var(--accent); }

.loader { display: none; text-align: center; padding: 24px; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--surface3);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-text {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 2px;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

.saved-tag-chip {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 10px; padding: 5px 14px;
  background: rgba(247,201,72,0.08);
  border: 1px solid rgba(247,201,72,0.25);
  border-radius: 20px; cursor: pointer;
  font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
  color: var(--accent); letter-spacing: 1px; transition: all 0.2s;
}
.saved-tag-chip:hover { background: rgba(247,201,72,0.15); transform: translateY(-1px); }

/* ══════════════════════════════════════
   TUTORIAL
══════════════════════════════════════ */
.tutorial {
  margin: 0 0 28px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  overflow: hidden;
}
.tutorial-header {
  padding: 14px 20px; display: flex; align-items: center;
  justify-content: space-between; cursor: pointer;
  border-bottom: 1px solid transparent; transition: border-color 0.2s; user-select: none;
}
.tutorial-header.open { border-bottom-color: var(--border2); }
.tutorial-title {
  font-family: 'Orbitron', monospace; font-size: 12px; font-weight: 700;
  color: var(--accent3); letter-spacing: 2px;
}
.tutorial-arrow { color: var(--accent3); font-size: 16px; transition: transform 0.3s; }
.tutorial-arrow.open { transform: rotate(180deg); }
.tutorial-body { display: none; padding: 20px; gap: 16px; }
.tutorial-body.open { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.tuto-card {
  background: var(--surface2); border-radius: 10px; padding: 14px;
  border: 1px solid var(--border2);
}
.tuto-card-title {
  font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
  color: var(--accent3); letter-spacing: 1px; margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.tuto-card p { font-size: 12px; color: var(--text-muted); font-family: 'Inter', sans-serif; line-height: 1.55; }
.tuto-legend { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.tuto-legend-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-muted); font-family: 'Inter', sans-serif;
}
.tuto-icon { width: 24px; height: 24px; flex-shrink: 0; object-fit: contain; }
.tuto-icon-emoji { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }

/* ══════════════════════════════════════
   PLAYER CARD
══════════════════════════════════════ */
.player-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}
.player-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
}
.player-avatar {
  width: 60px; height: 60px;
  border-radius: 12px; border: 2px solid var(--accent);
  background: var(--surface2); object-fit: cover; flex-shrink: 0;
}
.player-info { flex: 1; }
.player-name {
  font-family: 'Orbitron', monospace; font-size: 18px; font-weight: 700;
  color: var(--accent); margin-bottom: 2px;
}
.player-tag { font-size: 12px; color: var(--text-muted); font-family: 'Inter', sans-serif; margin-bottom: 10px; }
.player-stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stat-item { display: flex; flex-direction: column; gap: 1px; }
.stat-value { font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 700; color: var(--text); }
.stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-family: 'Inter', sans-serif; }

/* ══════════════════════════════════════
   RESOURCE PANEL
══════════════════════════════════════ */
.resource-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 16px 20px;
  margin-bottom: 20px;
  position: relative;
  display: none;
}
.resource-panel::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2));
  border-radius: 14px 14px 0 0;
}
.resource-panel-title {
  font-family: 'Orbitron', monospace; font-size: 11px; font-weight: 700;
  color: var(--accent3); letter-spacing: 2px; margin-bottom: 14px;
}
.resource-inputs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}
.resource-input-item { display: flex; flex-direction: column; gap: 4px; }
.resource-input-label {
  font-size: 11px; color: var(--text-muted); text-transform: uppercase;
  letter-spacing: 1px; font-family: 'Inter', sans-serif;
  display: flex; align-items: center; gap: 4px;
}
.resource-input-label img { width: 13px; height: 13px; object-fit: contain; }
.resource-input-field {
  padding: 8px 10px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
  outline: none; transition: all 0.2s; width: 100%;
}
.resource-input-field:focus { border-color: var(--accent3); box-shadow: 0 0 0 2px rgba(41,212,255,0.12); }
.resource-calc-btn {
  padding: 9px 18px;
  background: linear-gradient(135deg, var(--accent3), #0093c4);
  border: none; border-radius: 8px; color: #000;
  font-family: 'Orbitron', monospace; font-weight: 700; font-size: 10px;
  letter-spacing: 1px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.resource-calc-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 18px rgba(41,212,255,0.35); }
.resource-calc-result {
  font-size: 13px; color: var(--accent3); font-family: 'Inter', sans-serif;
  line-height: 1.6; margin-top: 10px; display: none;
  background: var(--surface2); border-radius: 8px; padding: 10px 14px;
  border: 1px solid var(--border2);
}
.resource-calc-result.show { display: block; }
.afford-ok   { color: #4ade80; font-size: 11px; font-weight: 800; margin-left: 3px; }
.afford-warn { color: var(--accent); font-size: 11px; font-weight: 800; margin-left: 3px; }
.afford-no   { color: var(--text-muted); font-size: 11px; margin-left: 3px; }

/* ══════════════════════════════════════
   TABS
══════════════════════════════════════ */
.tabs {
  display: flex; gap: 4px; margin-bottom: 20px;
  background: var(--surface); padding: 5px;
  border-radius: 12px; border: 1px solid var(--border2);
}
.tab-btn {
  flex: 1; padding: 11px 14px; background: transparent; border: none;
  border-radius: 8px; color: var(--text-muted);
  font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 700;
  letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.tab-btn.active {
  background: linear-gradient(135deg, rgba(247,201,72,0.15), rgba(255,112,67,0.08));
  color: var(--accent);
  border: 1px solid rgba(247,201,72,0.25);
}
.tab-btn:hover:not(.active) { color: var(--text); background: var(--surface2); }
.tab-content { display: none; }
.tab-content.active { display: block; }

/* ══════════════════════════════════════
   SECTION HEADER
══════════════════════════════════════ */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.section-title { font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 2px; }
.section-count { font-size: 12px; color: var(--text-muted); font-family: 'Inter', sans-serif; }

/* ══════════════════════════════════════
   TIER BADGES
══════════════════════════════════════ */
.tier-badge {
  padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 800;
  font-family: 'Orbitron', monospace; flex-shrink: 0; letter-spacing: 0.5px;
}
.tier-S { background: rgba(255,71,87,0.18); color: var(--tier-s); border: 1px solid rgba(255,71,87,0.4); }
.tier-A { background: rgba(255,112,67,0.18); color: var(--tier-a); border: 1px solid rgba(255,112,67,0.4); }
.tier-B { background: rgba(247,201,72,0.18); color: var(--tier-b); border: 1px solid rgba(247,201,72,0.4); }
.tier-C { background: rgba(74,222,128,0.15); color: var(--tier-c); border: 1px solid rgba(74,222,128,0.35); }
.tier-D { background: rgba(148,163,184,0.15); color: var(--tier-d); border: 1px solid rgba(148,163,184,0.3); }

/* ══════════════════════════════════════
   RARITY BADGES
══════════════════════════════════════ */
.rarity-badge {
  display: inline-block; font-size: 8px; font-weight: 700;
  font-family: 'Orbitron', monospace; letter-spacing: 0.5px;
  padding: 1px 5px; border-radius: 3px; text-transform: uppercase;
}
.rarity-common     { background: rgba(148,163,184,0.15); color: #94a3b8; border: 1px solid rgba(148,163,184,0.3); }
.rarity-rare       { background: rgba(74,222,128,0.12); color: #4ade80; border: 1px solid rgba(74,222,128,0.3); }
.rarity-super-rare { background: rgba(56,189,248,0.12); color: #38bdf8; border: 1px solid rgba(56,189,248,0.3); }
.rarity-epic       { background: rgba(167,139,250,0.15); color: #a78bfa; border: 1px solid rgba(167,139,250,0.35); }
.rarity-mythic     { background: rgba(251,113,133,0.15); color: #fb7185; border: 1px solid rgba(251,113,133,0.35); }
.rarity-legendary  { background: rgba(250,204,21,0.18); color: #facc15; border: 1px solid rgba(250,204,21,0.4); box-shadow: 0 0 8px rgba(250,204,21,0.15); }
@keyframes rainbow-text {
  0%   { color: #ff4757; }
  15%  { color: #ff7f50; }
  30%  { color: #ffd700; }
  45%  { color: #7fff00; }
  60%  { color: #00cfff; }
  75%  { color: #a78bfa; }
  90%  { color: #ff69b4; }
  100% { color: #ff4757; }
}
@keyframes rainbow-border {
  0%   { border-color: #ff4757; box-shadow: 0 0 10px rgba(255,71,87,0.5); }
  15%  { border-color: #ff7f50; box-shadow: 0 0 10px rgba(255,127,80,0.5); }
  30%  { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
  45%  { border-color: #7fff00; box-shadow: 0 0 10px rgba(127,255,0,0.5); }
  60%  { border-color: #00cfff; box-shadow: 0 0 10px rgba(0,207,255,0.5); }
  75%  { border-color: #a78bfa; box-shadow: 0 0 10px rgba(167,139,250,0.5); }
  90%  { border-color: #ff69b4; box-shadow: 0 0 10px rgba(255,105,180,0.5); }
  100% { border-color: #ff4757; box-shadow: 0 0 10px rgba(255,71,87,0.5); }
}
.rarity-ultra-legendary {
  background: rgba(255,255,255,0.07);
  animation: rainbow-text 3s linear infinite, rainbow-border 3s linear infinite;
  border: 1px solid;
  font-weight: 900;
}
.brawler-card.rarity-ultra-legendary {
  animation: rainbow-border 3s linear infinite;
  border-width: 2px;
}

/* ══════════════════════════════════════
   PRIORITY LIST
══════════════════════════════════════ */
.priority-grid { display: flex; flex-direction: column; gap: 8px; }
.priority-item {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px; padding: 12px 16px;
  display: flex; align-items: center; gap: 14px;
  cursor: pointer; transition: all 0.2s;
  position: relative; overflow: hidden;
}
.priority-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: 3px 0 0 3px;
}
.priority-item.tier-S::before { background: var(--tier-s); }
.priority-item.tier-A::before { background: var(--tier-a); }
.priority-item.tier-B::before { background: var(--tier-b); }
.priority-item.tier-C::before { background: var(--tier-c); }
.priority-item.tier-D::before { background: var(--tier-d); }
.priority-item:hover { border-color: rgba(247,201,72,0.35); transform: translateX(3px); background: var(--surface2); }
.priority-item.has-hc { border-color: rgba(167,139,250,0.35) !important; }

.priority-rank {
  font-family: 'Orbitron', monospace; font-size: 15px; font-weight: 900;
  color: var(--text-muted); width: 28px; text-align: center; flex-shrink: 0;
}
.brawler-img-small {
  width: 48px; height: 48px; border-radius: 9px; object-fit: cover;
  background: var(--surface2); flex-shrink: 0; border: 1px solid var(--border2);
}
.priority-info { flex: 1; min-width: 0; }
.priority-name {
  font-family: 'Orbitron', monospace; font-size: 13px; font-weight: 700;
  margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 5px;
}
.priority-details {
  font-size: 12px; color: var(--text-muted);
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.priority-score {
  font-family: 'Orbitron', monospace; font-size: 20px; font-weight: 900; flex-shrink: 0;
  display: flex; align-items: center; gap: 3px;
}

/* ══════════════════════════════════════
   BRAWLER GRID
══════════════════════════════════════ */
.brawler-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.brawler-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 13px; padding: 14px 10px; text-align: center;
  cursor: pointer; transition: all 0.2s;
